# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Configured secrets: SMTP_USER, SMTP_PASS, ADMIN_CLIENT_EMAIL, ADMIN_PRIVATE_KEY (BOM-free)

runConfig:
  # Minimum instances to keep warm for faster startup
  minInstances: 0
  # Maximum instances to scale up to
  maxInstances: 1
  # Memory limit for the server
  memory: 512MiB

env:
  - variable: NODE_ENV
    value: production

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-5538116689-bdfb2

  # Secure Cashier cutover controls. Runtime-only and deliberately dormant for Gate 1.
  - variable: STAFF_PIN_PEPPER_ACTIVE_VERSION
    value: v1
    availability:
      - RUNTIME

  - variable: BENTA_CASHIER_CHECKOUT_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: BENTA_CASHIER_HYBRID_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_BENTA_CASHIER_HYBRID_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  - variable: BENTA_CASHIER_OFFLINE_ENABLED
    value: "false"
    availability:
      - RUNTIME

  - variable: BENTA_CASHIER_IP_THROTTLE_ENABLED
    value: "false"
    availability:
      - RUNTIME

  # Secret references only. Values and IAM access require later Director-controlled provisioning.
  - variable: STAFF_PIN_PEPPER_V1
    secret: STAFF_PIN_PEPPER_V1
    availability:
      - RUNTIME

  - variable: RATE_LIMIT_HMAC_SECRET
    secret: RATE_LIMIT_HMAC_SECRET
    availability:
      - RUNTIME

  # Email sender (Gmail SMTP) — required by /api/auth/send-verification
  - variable: SMTP_USER
    secret: SMTP_USER
    availability:
      - RUNTIME

  - variable: SMTP_PASS
    secret: SMTP_PASS
    availability:
      - RUNTIME

  # Firebase Admin SDK — required for generateEmailVerificationLink()
  - variable: ADMIN_CLIENT_EMAIL
    secret: ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: ADMIN_PRIVATE_KEY
    secret: ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME
