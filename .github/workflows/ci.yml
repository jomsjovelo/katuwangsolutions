name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Benta unit tests
        run: pnpm tsx scripts/run-benta-unit-tests.ts

      - name: Run Order Snap unit tests
        run: pnpm tsx scripts/run-order-snap-unit-tests.ts

      - name: Run Benta emulator tests
        run: pnpm firebase emulators:exec --config firebase.emulators.json --only auth,firestore --project demo-katuwang-offline-test "pnpm tsx scripts/run-benta-emulator-tests.ts"

      - name: Run Order Snap emulator tests
        run: pnpm firebase emulators:exec --config firebase.emulators.json --only firestore --project demo-katuwang-ordersnap-test "pnpm tsx test/order-snap-transaction.emulator.test.ts && pnpm tsx test/order-snap-sync.emulator.test.ts"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build Next.js
        run: pnpm run build

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: pnpm exec next start -p 9002
          wait-on: 'http://localhost:9002'
          wait-on-timeout: 120
          command: pnpm run cypress
